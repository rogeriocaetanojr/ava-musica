<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Crie uma nova senha na Escola John Meyer</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f4f4f5">
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="background-color: #f4f4f5"
    >
      <tr>
        <td align="center" style="padding: 16px 12px">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="width: 100%; max-width: 480px; border-collapse: separate"
          >
            <tr>
              <td
                style="
                  background-color: #6e1a2d;
                  padding: 10px 20px;
                  border-radius: 12px 12px 0 0;
                  font-family: Arial, Helvetica, sans-serif;
                  font-size: 16px;
                  line-height: 22px;
                  font-weight: bold;
                  color: #ffffff;
                "
              >
                Escola John Meyer
              </td>
            </tr>
            <tr>
              <td
                style="
                  background-color: #ffffff;
                  padding: 24px 20px;
                  border: 1px solid #e4e4e7;
                  border-top: 0;
                  border-radius: 0 0 12px 12px;
                "
              >
                <p
                  style="
                    margin: 0 0 20px;
                    font-family: Arial, Helvetica, sans-serif;
                    font-size: 16px;
                    line-height: 24px;
                    color: #18181b;
                  "
                >
                  Recebemos um pedido para trocar sua senha.
                </p>
                <table
                  role="presentation"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                >
                  <tr>
                    <td style="background-color: #6e1a2d; border-radius: 8px">
                      <a
                        href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=recovery"
                        style="
                          display: inline-block;
                          padding: 12px 24px;
                          font-family: Arial, Helvetica, sans-serif;
                          font-size: 16px;
                          line-height: 20px;
                          font-weight: bold;
                          color: #ffffff;
                          text-decoration: none;
                          border-radius: 8px;
                        "
                        >Criar nova senha</a
                      >
                    </td>
                  </tr>
                </table>
                <p
                  style="
                    margin: 16px 0 0;
                    font-family: Arial, Helvetica, sans-serif;
                    font-size: 13px;
                    line-height: 20px;
                    color: #71717a;
                  "
                >
                  Se não foi você, ignore este e-mail.
                </p>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 12px 20px;
                  font-family: Arial, Helvetica, sans-serif;
                  font-size: 11px;
                  line-height: 16px;
                  color: #71717a;
                  text-align: center;
                "
              >
                Escola de Música John Meyer
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
