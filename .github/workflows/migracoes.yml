name: Migrações do banco

# Aplica as migrações de supabase/migrations nos projetos da nuvem, depois que
# o CI passa na main: primeiro na homologação, sozinho; depois na produção, só
# com a aprovação de um revisor do environment "producao" (Settings →
# Environments). Passo a passo em guias/deploy.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Uma aplicação por vez: duas seguidas nunca disputam o mesmo banco.
concurrency:
  group: migracoes
  cancel-in-progress: false

jobs:
  homologacao:
    name: Homologação
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: homologacao
    steps:
      - uses: actions/checkout@v4
        with:
          # O commit que passou no CI, e não o mais recente da main.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Mostra o que vai ser aplicado antes de aplicar.
      - name: O que falta aplicar
        run: npx supabase db push --db-url "$SUPABASE_DB_URL" --dry-run
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      - name: Aplicar
        run: npx supabase db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

  producao:
    name: Produção (com aprovação)
    needs: homologacao
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: producao
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: O que falta aplicar
        run: npx supabase db push --db-url "$SUPABASE_DB_URL" --dry-run
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      - name: Aplicar
        run: npx supabase db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
