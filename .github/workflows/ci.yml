name: CI

# Roda a cada push na main e em todo pull request (inclusive os do Dependabot),
# para o código quebrado aparecer antes de chegar à main.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  segredos:
    name: Segredos no histórico (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth 0 traz o histórico inteiro, para varrer todos os commits.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          versao=8.28.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${versao}/gitleaks_${versao}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

  app:
    name: Lint, tipos, testes, auditoria e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Valores de exemplo: o build confere que todas existem (src/lib/env.ts).
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: chave-anon-de-exemplo
      SUPABASE_SERVICE_ROLE_KEY: chave-service-role-de-exemplo
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "54325"
      SMTP_REMETENTE: Escola de Música <avisos@exemplo.local>
      EMAIL_PROFESSOR: professor@exemplo.local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Só as dependências que vão para o site; falha em falha alta ou crítica.
      - name: Auditoria das dependências
        run: npm audit --omit=dev --audit-level=high
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  banco:
    name: Testes SQL das regras de acesso
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Stubs do Supabase
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/_stubs.sql
      - name: Migrações
        run: |
          for arquivo in supabase/migrations/*.sql; do
            echo "Aplicando $arquivo"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$arquivo"
          done
      - run: npm run test:db

  e2e:
    name: Ponta a ponta (Playwright, build de produção)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Supabase local no runner (Docker), com as migrações do repositório.
      # Os serviços que os testes não usam ficam de fora, para subir mais rápido.
      - name: Supabase local
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      # O site e o seed leem o endereço e as chaves do Supabase local; o resto
      # das variáveis vem do playwright.config.ts.
      - name: Variáveis do Supabase local
        run: |
          eval "$(npx supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } > .env.local
      - name: Navegador do Playwright
        run: npx playwright install --with-deps chromium
      # O globalSetup recria o banco e roda o seed; o Playwright faz o build de
      # produção e sobe o next start (E2E_PRODUCAO=1).
      - name: Testes de ponta a ponta
        run: npm run test:e2e
        env:
          E2E_PRODUCAO: "1"
      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7
